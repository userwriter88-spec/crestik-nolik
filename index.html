<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Крестики-Нолики</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Крестики-Нолики</h1>

    <!-- МОДАЛКА ПАРОЛЯ -->
    <div id="password-modal" class="modal hidden">
        <div class="modal-content">
            <h3>Комната защищена паролем</h3>
            <input type="password" id="password-input" placeholder="Введите пароль..." maxlength="30">
            <div id="password-error" class="room-error hidden"></div>
            <div class="modal-buttons">
                <button id="password-ok">Войти</button>
                <button id="password-cancel">Отмена</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА ВЫБОРА РОЛИ -->
    <div id="role-modal" class="modal hidden">
        <div class="modal-content">
            <h3>Войти в комнату как...</h3>
            <div class="role-buttons">
                <button id="role-player" class="role-btn role-btn-player">Игрок</button>
                <button id="role-viewer" class="role-btn role-btn-viewer">Наблюдатель</button>
                <button id="role-cancel" class="role-btn role-btn-cancel">Отмена</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА ВЫБОРА РЕЖИМА ИИ -->
    <div id="ai-modal" class="modal hidden">
        <div class="modal-content">
            <h3>Игра против ИИ</h3>
            <p style="margin-bottom:12px;color:#666;font-size:14px;">Выберите режим:</p>
            <div class="role-buttons">
                <button id="ai-local" class="role-btn">Локально</button>
                <button id="ai-room" class="role-btn">Создать комнату</button>
                <button id="ai-cancel" class="role-btn role-btn-cancel">Отмена</button>
            </div>
            <div class="ai-chat-option" style="margin-top:12px;text-align:center;">
                <input type="checkbox" id="ai-chat-check" checked>
                <label for="ai-chat-check">Чат в комнате</label>
            </div>
        </div>
    </div>

    <!-- ЛОББИ -->
    <div id="lobby-view">
        <div class="lobby-card">
            <h2>Создать комнату</h2>
            <div class="lobby-create">
                <input type="text" id="room-name-input" placeholder="Название комнаты..." maxlength="30">
                <button id="create-room-btn">Создать</button>
            </div>
            <div class="lobby-password-option">
                <input type="checkbox" id="room-password-check">
                <label for="room-password-check">Пароль</label>
                <input type="password" id="room-password-input" placeholder="Пароль..." maxlength="30" disabled>
            </div>
            <div class="lobby-chat-option">
                <input type="checkbox" id="room-chat-check" checked>
                <label for="room-chat-check">Чат</label>
            </div>
            <div id="room-error" class="room-error hidden"></div>
        </div>

        <div class="lobby-card">
            <h2>Доступные комнаты</h2>
            <div id="room-list" class="room-list">
                <div class="room-list-empty">Загрузка...</div>
            </div>
        </div>

        <div class="lobby-card lobby-ai-card">
            <h2>Одиночная игра</h2>
            <p class="lobby-ai-desc">Играйте против компьютера без подключения к сети</p>
            <button id="play-ai-btn">Играть против ИИ</button>
        </div>
    </div>

    <!-- ИГРА -->
    <div id="game-view" class="hidden">
        <div class="game-header">
            <span id="role-badge" class="role-badge"></span>
            <span id="room-name-display"></span>
            <button id="leave-room-btn">Покинуть</button>
        </div>

        <div class="game-content">
            <div class="score-board">
                <div>X: <span id="scoreX">0</span></div>
                <div>Ничьи: <span id="scoreDraws">0</span></div>
                <div>O: <span id="scoreO">0</span></div>
            </div>

            <div id="status">Ходят Х</div>

            <div class="board-container">
                <div class="strike-line" id="strike-line"></div>
                <div class="board" id="board">
                    <div class="cell" data-index="0"></div>
                    <div class="cell" data-index="1"></div>
                    <div class="cell" data-index="2"></div>
                    <div class="cell" data-index="3"></div>
                    <div class="cell" data-index="4"></div>
                    <div class="cell" data-index="5"></div>
                    <div class="cell" data-index="6"></div>
                    <div class="cell" data-index="7"></div>
                    <div class="cell" data-index="8"></div>
                </div>
            </div>

            <button id="restart">Начать заново</button>

            <div class="fireworks-container">
                <svg id="fireworks" width="150" height="150" viewBox="0 0 100 100" style="display: none;">
                    <circle cx="50" cy="50" r="1" fill="none" stroke="#ff3b30" stroke-width="2" stroke-dasharray="3 3">
                        <animate attributeName="r" values="1;40" dur="1.5s" repeatCount="indefinite" />
                        <animate attributeName="opacity" values="1;0" dur="1.5s" repeatCount="indefinite" />
                    </circle>
                    <circle cx="30" cy="40" r="1" fill="none" stroke="#ff9500" stroke-width="1.5" stroke-dasharray="2 4">
                        <animate attributeName="r" values="1;25" dur="1.2s" begin="0.3s" repeatCount="indefinite" />
                        <animate attributeName="opacity" values="1;0" dur="1.2s" begin="0.3s" repeatCount="indefinite" />
                    </circle>
                    <circle cx="70" cy="40" r="1" fill="none" stroke="#4cd964" stroke-width="1.5" stroke-dasharray="2 2">
                        <animate attributeName="r" values="1;30" dur="1.4s" begin="0.6s" repeatCount="indefinite" />
                        <animate attributeName="opacity" values="1;0" dur="1.4s" begin="0.6s" repeatCount="indefinite" />
                    </circle>
                    <circle cx="50" cy="50" r="2" fill="#ffcc00">
                        <animate attributeName="opacity" values="1;0;1" dur="0.5s" repeatCount="indefinite" />
                    </circle>
                </svg>
            </div>
        </div>

        <button id="chat-toggle-btn">
            💬 <span id="chat-badge" class="badge-hidden">0</span>
        </button>

        <div id="chat-toast" class="toast-hidden"></div>

        <div id="chat-container" class="chat-closed">
            <div id="chat-header">
                <h3>Чат</h3>
                <button id="chat-close-btn">&times;</button>
            </div>
            <div id="chat-messages" data-placeholder="Пока нет сообщений"></div>
            <div id="chat-typing" class="chat-typing hidden"></div>
            <div id="chat-input-zone">
                <input type="text" id="chat-input" placeholder="Сообщение..." maxlength="100">
                <button id="chat-send-btn">Отправить</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="ai.js"></script>
    <script src="line.js"></script>
    <script src="script.js"></script>
</body>
</html>
